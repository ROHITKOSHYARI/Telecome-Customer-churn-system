spring:
  datasource:
    url: ${DB_URL}
    username: postgres

  jpa:
    show-sql: true

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  application:
    name: customerChurn

logging:
  level:
    org:
      springframework:
        security: TRACE